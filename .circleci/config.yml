version: 2.1

# Define reusable executors
executors:
  java-playwright:
    docker:
      - image: mcr.microsoft.com/playwright/java:v1.50.0-noble
    working_directory: ~/project
    resource_class: large

# Define jobs
jobs:
  # Build and test job
  build-and-test:
    executor: java-playwright
    steps:
      - checkout
      
      # Cache Maven dependencies
      - restore_cache:
          keys:
            - v1-maven-deps-{{ checksum "pom.xml" }}
            - v1-maven-deps-
      
      # Install Maven dependencies
      - run:
          name: Download Dependencies
          command: mvn dependency:resolve dependency:resolve-plugins
      
      # Save Maven dependencies to cache
      - save_cache:
          key: v1-maven-deps-{{ checksum "pom.xml" }}
          paths:
            - ~/.m2
      
      # Compile the project (Linux: no mac-local profile — Playwright uses image browsers)
      - run:
          name: Compile Project  
          command: mvn compile -DskipTests
      
      - run:
          name: Prepare test output directories
          command: mkdir -p test-output/screenshots
      
      # Run tests (headless via HEADLESS env → ConfigReader)
      - run:
          name: Run Tests
          command: mvn test
          no_output_timeout: 30m
          environment:
            SMTP_USERNAME: ${SMTP_USERNAME}
            SMTP_PASSWORD: ${SMTP_PASSWORD}
            HEADLESS: "true"
            CI: "true"
      
      # Store test results for CircleCI
      - store_test_results:
          path: target/surefire-reports
      
      # Store test artifacts (reports, screenshots)
      - store_artifacts:
          path: test-output
          destination: test-output
      
      - store_artifacts:
          path: target/surefire-reports
          destination: surefire-reports

# Define workflows
workflows:
  version: 2
  
  # Main workflow - runs ONLY on canary branch
  canary-automation:
    jobs:
      - build-and-test:
          filters:
            branches:
              only:
                - canary
  
  # Nightly build - runs all tests at midnight UTC on canary branch only
  nightly-canary:
    triggers:
      - schedule:
          cron: "0 0 * * *"
          filters:
            branches:
              only:
                - canary
    jobs:
      - build-and-test
