version: 2.1

executors:
  playwright-ts:
    docker:
      - image: mcr.microsoft.com/playwright:v1.50.0-noble
    working_directory: ~/project
    resource_class: large

jobs:
  build-and-test:
    executor: playwright-ts
    steps:
      - checkout

      - restore_cache:
          keys:
            - v1-npm-deps-{{ checksum "playwright-ts/package-lock.json" }}
            - v1-npm-deps-

      - run:
          name: Install dependencies
          working_directory: playwright-ts
          command: npm ci

      - save_cache:
          key: v1-npm-deps-{{ checksum "playwright-ts/package-lock.json" }}
          paths:
            - ~/.npm
            - playwright-ts/node_modules

      - run:
          name: Run Playwright tests
          working_directory: playwright-ts
          no_output_timeout: 45m
          environment:
            HEADLESS: "true"
            CI: "true"
          command: npx playwright test --reporter=list,html,junit

      - store_test_results:
          path: playwright-ts/test-results/junit.xml

      - store_artifacts:
          path: playwright-ts/playwright-report
          destination: playwright-report

      - store_artifacts:
          path: playwright-ts/test-results
          destination: test-results

workflows:
  version: 2

  canary-automation:
    jobs:
      - build-and-test:
          filters:
            branches:
              only:
                - canary

  nightly-canary:
    triggers:
      - schedule:
          cron: "0 0 * * *"
          filters:
            branches:
              only:
                - canary
    jobs:
      - build-and-test
